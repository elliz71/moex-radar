name: Keep Streamlit Alive

on:
  schedule:
    # Каждые 20 минут
    - cron: '*/20 * * * *'
  workflow_dispatch:  # Возможность запустить вручную

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          echo "🔄 Пингую приложение в $(date)"
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://my-moex-radar-24.streamlit.app/
          echo "✅ Готово!"
      
      - name: Wait 5 seconds
        run: sleep 5
      
      - name: Ping again (для надёжности)
        run: |
          curl -s -o /dev/null https://my-moex-radar-24.streamlit.app/
          echo "✅ Второй пинг отправлен"
