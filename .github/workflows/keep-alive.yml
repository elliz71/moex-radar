          echo ""
          
          # Пробуем подключиться с повторными попытками
          for i in 1 2 3; do
            echo " Попытка $i из 3..."
            
            HTTP_CODE=$(curl -L -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 \
